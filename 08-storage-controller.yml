- name: Install storage controller
  hosts: mk8s
  gather_facts: false
  tasks:
    - name: Install prometheus-operator
      block:
        - name: Add prometheus operator repository
          kubernetes.core.helm_repository:
            repo_name: prometheus-community
            repo_url: https://prometheus-community.github.io/helm-charts
            repo_state: present
            kubeconfig: '{{ home_dir }}/.kube/config'
        - name: Install prometheus operator
          kubernetes.core.helm:
            release_name: prometheus-operator
            release_namespace: prometheus-community
            create_namespace: true
            kubeconfig: '{{ home_dir }}/.kube/config'
            chart_ref: prometheus-community/kube-prometheus-stack
            release_state: present

    - name: Add rook repository
      kubernetes.core.helm_repository:
        repo_name: rook-release
        repo_url: https://charts.rook.io/release
        repo_state: present
        kubeconfig: '{{ home_dir }}/.kube/config'

    - name: Install rook-ceph
      kubernetes.core.helm:
        release_name: rook-ceph
        release_namespace: rook-ceph
        create_namespace: true
        chart_ref: rook-release/rook-ceph
        kubeconfig: '{{ home_dir }}/.kube/config'
        release_state: present
        reuse_values: true
        release_values:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: "Exists"
              effect: "NoSchedule"
          monitoring:
            enabled: true

    - name: Create ceph cluster
      kubernetes.core.helm:
        release_name: rook-ceph-cluster
        release_namespace: rook-ceph
        create_namespace: true
        chart_ref: rook-release/rook-ceph-cluster
        kubeconfig: '{{ home_dir }}/.kube/config'
        release_state: present
        release_values:
          csiDriverNamePrefix: rook-ceph
          monitoring:
            enabled: true
            createPrometheusRules: true
          toolbox:
            enabled: true
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                effect: "NoSchedule"
                operator: Exists
